<style>
  @import '/css/deprecated-login-credentials.css';

  html {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    height: 100%;
    margin: 0;
  }

  .__private__homey-login-credentials {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__form {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__center {
    width: 100%;
    flex-shrink: 0;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }

  .pair-view-flex-spacer {
    flex-grow: 1;
    flex-shrink: 0;
    min-height: var(--homey-su-2);
  }

  .__private__homey-login-credentials__footer {
    flex-shrink: 0;
  }

  .serial-hint {
    margin-top: var(--homey-su-1);
    margin-bottom: 0;
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
  }

  .homey-form-input-large.read-only-input {
    background-color: #e9ecef !important;
    color: #6c757d !important;
    border-color: #ced4da !important;
    pointer-events: none !important;
  }
</style>

<div class="__private__homey-login-credentials">
  <form
    id="configure-manual-form"
    class="__private__homey-login-credentials__form homey-form"
    action="/"
    method="post"
  >
    <div class="__private__homey-login-credentials__center">
      <h1
        id="login-credentials-title"
        class="homey-title homey-text-align-center"
        data-i18n="pair.title"
      ></h1>

      <div class="homey-form-group-large">
        <label class="homey-form-label" for="ip" data-i18n="pair.ip_label"></label>
        <input
          class="homey-form-input-large"
          id="ip"
          type="text"
          value=""
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          data-i18n-placeholder="pair.ip_placeholder"
        />
      </div>

      <div class="homey-form-group-large">
        <label class="homey-form-label" for="serial">
          <span data-i18n="pair.serial_label"></span>
          <span data-i18n="pair.serial_optional"></span>
        </label>
        <input
          class="homey-form-input-large"
          id="serial"
          type="text"
          value=""
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          data-i18n-placeholder="pair.serial_placeholder"
        />
        <p class="homey-subtitle serial-hint" data-i18n="pair.serial_hint"></p>
      </div>
    </div>

    <div class="pair-view-flex-spacer" aria-hidden="true"></div>

    <div class="__private__homey-login-credentials__footer">
      <button
        tabindex="0"
        class="homey-button-primary-shadow-full __private__homey-login-credentials__button"
        id="connect"
        data-i18n="pair.connect_button"
        type="submit"
      ></button>
    </div>
  </form>
</div>

<script type="text/javascript">
  (function () {
    var $ip = document.getElementById('ip');
    var $serial = document.getElementById('serial');
    var $btn = document.getElementById('connect');

    Homey.setTitle(null);

    // Repair registers get_current; pair does not — ignore reject there.
    Homey.emit('get_current').then(function (data) {
      if (!data) return;
      if (data.ip) $ip.value = data.ip;
      if (data.serial) {
        $serial.value = data.serial;
        $serial.readOnly = true;
        $serial.classList.add('read-only-input');
      }
    }).catch(function () {});

    document.getElementById('configure-manual-form').addEventListener('submit', function (event) {
      event.preventDefault();
      if ($btn.classList.contains('is-loading')) return;
      $btn.classList.add('is-loading');

      Homey.emit('configure_manual', {
        ip: $ip.value.trim(),
        serial: $serial.value.trim(),
      }).then(function (next) {
        // Pair returns list_devices; repair returns nothing and closes.
        if (next) Homey.showView(next);
        else Homey.done();
      }).catch(function (err) {
        $btn.classList.remove('is-loading');
        Homey.alert(err);
      });

      return false;
    });
  })();
</script>
