<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h3 { margin: 0 0 14px 0; font-size: 16px; }
    .section { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
    input[type="text"] {
      width: 100%; padding: 8px; box-sizing: border-box;
      font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: white;
    }
    input[readonly] { background: #eee; color: #555; }
    .hint  { font-size: 12px; color: #888; margin-top: 5px; }
    .note  { font-size: 12px; color: #b45309; background: #fffbeb;
             border: 1px solid #fcd34d; border-radius: 4px;
             padding: 8px 10px; margin-bottom: 16px; }
    button.primary {
      width: 100%; padding: 10px; margin-top: 8px;
      background: #00B140; color: white; border: none;
      border-radius: 4px; font-size: 14px; cursor: pointer;
    }
    button.primary:disabled { background: #aaa; cursor: default; }
    .status { margin-top: 10px; font-size: 13px; color: #555; text-align: center; min-height: 20px; }
    #err    { color: #c62828; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h3 data-i18n="repair.title">Repair DTU Connection</h3>

  <div class="note" id="note" data-i18n="repair.note">
    Panel count, three-phase, and hybrid settings cannot be changed here — those require re-pairing to add or remove device tiles.
  </div>

  <div class="section">
    <label for="serial" data-i18n="pair.serial_label">DTU Serial Number</label>
    <input type="text" id="serial" readonly />
  </div>

  <div class="section">
    <label for="ip" data-i18n="repair.ip_label">DTU IP Address</label>
    <input type="text" id="ip" placeholder="192.168.1.x" />
    <div class="hint" data-i18n="repair.ip_hint">The local IP of your Hoymiles DTU.</div>
  </div>

  <button class="primary" id="save-btn" onclick="doSave()">
    <span data-i18n="repair.save_button">Save</span>
  </button>
  <div class="status" id="save-status"></div>
  <div id="err"></div>

  <script>
    Homey.ready(function() {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        var t   = Homey.__(key);
        if (t && t !== key) el.textContent = t;
      });

      Homey.emit('get_current', null, function(err, data) {
        if (err || !data) {
          document.getElementById('err').textContent = err ? (err.message || String(err)) : 'Failed to load device info.';
          return;
        }
        document.getElementById('serial').value = data.serial || '';
        document.getElementById('ip').value = data.ip || '';
      });
    });

    function doSave() {
      var saveBtn  = document.getElementById('save-btn');
      var statusEl = document.getElementById('save-status');
      var errEl    = document.getElementById('err');

      saveBtn.disabled     = true;
      errEl.textContent    = '';
      statusEl.textContent = Homey.__('repair.saving') || 'Saving…';

      Homey.emit('configure_manual', {
        ip: document.getElementById('ip').value.trim()
      }, function(err) {
        if (err) {
          saveBtn.disabled     = false;
          statusEl.textContent = '';
          errEl.textContent    = err.message || String(err);
        } else {
          statusEl.textContent = '';
          Homey.done();
        }
      });
    }
  </script>
</body>
</html>
